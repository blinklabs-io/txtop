# Generated automatically by org-governance-bot. Do not edit manually.
name: "ci"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
      - v*.*.*

jobs:
  go-test:
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main
    with:
      go-versions: '["1.26.x"]'
      nilaway-include-pkgs: github.com/blinklabs-io/txtop
      nilaway-version: latest
      run-golangci-lint: true
      run-nilaway: true
  publish:
    needs: [go-test]
    if: github.event_name == 'push'
    uses: blinklabs-io/actions/.github/workflows/reuseable-publish.yml@main
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}
    with:
      binary-name: txtop
      description: txtop is a mempool display tool for a Cardano Node
      docker-image: blinklabs/txtop
      go-version: 1.26.x
